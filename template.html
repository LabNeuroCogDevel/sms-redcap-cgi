<html>
<head>
<title>SMS</title>
<style>
  summary { background-color: #543; border: solid black 1px; cursor: pointer;}
  .msg              { margin: .5em; padding: .5em; }
  /* our own messages */
  .msg.outbound-api { background-color: lightgray; margin: 1em}
  /* messages from participant */
  .msg.inbound      { background-color: lightblue; padding-left: .2em; }

  /* message info */
  .name  {font-size: smaller; display: inline;}
  .phone {font-size: smaller; display: inline;}
  .time  {font-size: smaller; color: gray; display: inline; padding: .5em}

  .inbound > .name::before {content: "from: "; color: gray}
  .inbound > .name {color: green; font-weight: bold;}
  .inbound > .phone {color: green;}

  /* from us isn't as important */
  .outbound-api > .name::before {content: "to: "; color: gray}
  .outbound-api > .name {font-size: 8px; font-color:gray; }
  .outbound-api > .phone {font-size: 8px; font-color:gray;}
  .outbound-api > .phone::before {content: "from:"; color:gray;}
</style>
</head>

<body>

  <div id="log">
     <form method="POST">
      <input name=to list="phones" placeholder="Search lunaid...">
      <datalist id="phones">
        {% for phone, info in numbers.items() %}
        <option value={{phone}}> {{info.lunaid}} {{info.name}} ({{phone}} {{info.source}}) </option>
        {% endfor %}
      </datalist>
      <br>
      <textarea rows="4" cols="50" name="msg">sms_appointment_reminders</textarea>
      </br>
      <button type=submit name=send value=send-top>send!</button>
      </form>
  </div>

  <hr>
  <!-- per lunaid conversation -->
  <div id=by_id>
  {% for lunaid,messages in per_id.items() %}
   <details>
   <summary> recordid <tt>{{lunaid}}</tt>
             ({{messages|length}}, {{messages[-1]['date_sent']}})
    </summary>
    {% for msg in messages %}
    <div class="msg {{msg.direction}}">
      <div class=name> {{msg.name}} </div>
      <div class=phone> {{msg.from}}</div>
      <div class=body> {{msg.body}} </div>
      <div class=time> {{msg.date_sent}}</div>
    </div>
    {% endfor %}
    <!-- send form -->
    <div class="outbound-api">
      <form method="POST">
         <label for="msg">to: {{messages[0].subj_num}}</label><br>
         <textarea rows="4" cols="50" name="msg">sms_appointment_reminders</textarea>
         <br>
         <input name=to value={{messages[0].subj_num}} type=hidden /></input>
         <input name=lunaid value={{lunaid}} type=hidden /></input>
         <br>
         <button type=submit name=send value=send-inline>send!</button>
      </form>
     </div>
    </details>
  {% endfor %}
  </div>

</body>
</html>
